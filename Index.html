<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Force Simulator</title>
    <!-- <link type="icon" rel="image/ico" href="Assets/Icon/KirbElectron.ico"> -->
    <link rel="shortcut icon" href="Assets/Icon/KirbElectron.ico">

    <link rel="stylesheet" href="Assets/Css/Styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="text-white p-3">
        <h1 class="text-center">Simulador de Fuerza Electrica</h1>
    </header>
    <main class="container my-4 flex-grow-1">
        <div class="row">
            <div class="col-md-6">
                <h2>Controles de Simulacion</h2>
                <form>
                    <div class="form-group">
                        <label for="charge1">Carga 1 (C):</label>
                        <input type="number" class="form-control" id="carga1" step="0.000001">
                    </div>
                    <div class="form-group">
                        <label for="charge2">Carga 2 (C):</label>
                        <input type="number" class="form-control" id="carga2" step="0.000001">
                    </div>
                    <div class="form-group">
                        <label for="distance">Distancia (m):</label>
                        <input type="number" class="form-control" id="distancia" step="0.000001">
                    </div>
                    <button type="button" class="btn btn-primary" onclick="calculateForce()">Calcular Fuerza</button>
                </form>
            </div>
            <div class="col-md-6">
                <h2>Resultados</h2>
                <p id="forceResult"></p>
            </div>
        </div>
    </main>
    <footer class="text-white text-center p-3">
        &copy; 2024 Electric Force Simulator
    </footer>
    <script src="Assets/Js/UI.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
